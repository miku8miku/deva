<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" viewBox="0 0 960 540"><title>Deva highlights: All in Chat, personas, subagents, rewind, scheduled tasks, mobile replies</title><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#6D28D9"/><stop offset="1" stop-color="#4F46E5"/></linearGradient><clipPath id="win"><rect width="880" height="404" x="40" y="36" rx="14"/></clipPath><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="6" flood-color="#1E1B4B" flood-opacity=".35" stdDeviation="10"/></filter><filter id="pop" width="120%" height="150%" x="-10%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#111827" flood-opacity=".18" stdDeviation="6"/></filter><style>@keyframes show{0%,16.6%{opacity:0}1%,15.6%{opacity:1}}@keyframes inA{0%,1%{opacity:0;transform:translateY(8px)}2.5%{opacity:1;transform:translateY(0)}}@keyframes inB{0%,3.5%{opacity:0;transform:translateY(8px)}5%{opacity:1;transform:translateY(0)}}@keyframes inC{0%,6%{opacity:0;transform:translateY(8px)}7.5%{opacity:1;transform:translateY(0)}}@keyframes inD{0%,9.5%{opacity:0;transform:translateY(8px)}11%{opacity:1;transform:translateY(0)}}@keyframes inE{0%,12%{opacity:0;transform:translateY(8px)}13.5%{opacity:1;transform:translateY(0)}}@keyframes f1{0%,5%{transform:scaleX(0)}7.5%{transform:scaleX(1)}}@keyframes f2{0%,5%{transform:scaleX(0)}9%{transform:scaleX(1)}}@keyframes f3{0%,5%{transform:scaleX(0)}10.5%{transform:scaleX(1)}}@keyframes k1{0%,7.5%{opacity:0}8.3%{opacity:1}}@keyframes k2{0%,9%{opacity:0}9.8%{opacity:1}}@keyframes k3{0%,10.5%{opacity:0}11.3%{opacity:1}}@keyframes pg{0%{transform:scaleX(0)}16.6%{transform:scaleX(1)}}text{dominant-baseline:auto}.mono{font-family:Consolas,&apos;SF Mono&apos;,Menlo,monospace}.hl,.sc{animation-timing-function:ease-out}.hl,.pg,.sc{animation-duration:36s;animation-iteration-count:infinite;animation-fill-mode:both;animation-delay:0s}.a,.b,.c,.d,.e{animation-timing-function:ease-out}.a,.b,.c,.d,.e,.f1,.f2,.f3,.k1,.k2,.k3{animation-duration:36s;animation-iteration-count:infinite;animation-fill-mode:both;animation-delay:0s}.k1,.k2,.k3{animation-timing-function:ease-out}.hl,.sc{animation-name:show}.a{animation-name:inA}.b{animation-name:inB}.c{animation-name:inC}.d{animation-name:inD}.e{animation-name:inE}.f1,.f2,.f3,.pg{transform-box:fill-box;transform-origin:0 50%;animation-timing-function:linear}.f1{animation-name:f1}.f2{animation-name:f2}.f3{animation-name:f3}.k1{animation-name:k1}.k2{animation-name:k2}.k3{animation-name:k3}.pg{animation-name:pg}.s2,.s2 *,.t2,.t2 *{animation-delay:6s}.s3,.s3 *,.t3,.t3 *{animation-delay:12s}.s4,.s4 *,.t4,.t4 *{animation-delay:18s}.s5,.s5 *,.t5,.t5 *{animation-delay:24s}.s6,.s6 *,.t6,.t6 *{animation-delay:30s}</style></defs><rect width="960" height="540" fill="url(#bg)"/><rect width="880" height="404" x="40" y="36" fill="#FFF" filter="url(#shadow)" rx="14"/><g clip-path="url(#win)"><rect width="880" height="32" x="40" y="36" fill="#F9FAFB"/><rect width="56" height="372" x="40" y="68" fill="#F5F3FF"/><line x1="40" x2="920" y1="68" y2="68" stroke="#EDE9FE"/><line x1="96" x2="920" y1="104" y2="104" stroke="#F3F4F6"/></g><circle cx="62" cy="52" r="5" fill="#F87171"/><circle cx="80" cy="52" r="5" fill="#FBBF24"/><circle cx="98" cy="52" r="5" fill="#34D399"/><text x="480" y="56" fill="#6B7280" font-size="12" text-anchor="middle">Deva</text><circle cx="68" cy="100" r="19" fill="none" stroke="#6D28D9" stroke-width="2"/><circle cx="68" cy="100" r="15" fill="#6D28D9"/><text x="68" y="105" fill="#FFF" font-size="13" font-weight="700" text-anchor="middle">D</text><circle cx="68" cy="144" r="15" fill="#DB2777"/><text x="68" y="149" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">X</text><rect width="784" height="32" x="116" y="396" fill="#FFF" stroke="#E5E7EB" rx="8"/><text x="132" y="417" fill="#9CA3AF" font-size="12">Message Deva, or type / for commands</text><g class="sc s1"><text x="116" y="91" fill="#111827" font-size="14" font-weight="700">All in Chat · Chat, create skills, connect MCP, all in one conversation</text><g class="a"><rect width="232" height="34" x="668" y="120" fill="#6D28D9" rx="12"/><text x="886" y="142" fill="#FFF" font-size="13" text-anchor="end">How do I sort a Python list by date?</text></g><g class="b"><circle cx="128" cy="180" r="12" fill="#6D28D9"/><text x="128" y="184" fill="#FFF" font-size="11" font-weight="700" text-anchor="middle">D</text><rect width="270" height="54" x="152" y="166" fill="#F3F4F6" rx="12"/><text x="166" y="187" fill="#111827" font-size="13">Just use the <tspan class="mono" font-size="12">key</tspan> argument of <tspan class="mono" font-size="12">sort</tspan>:</text><text x="166" y="208" fill="#6D28D9" class="mono" font-size="12">items.sort(key=lambda x: x.date)</text></g><g class="c"><rect width="355" height="34" x="545" y="232" fill="#6D28D9" rx="12"/><text x="886" y="254" fill="#FFF" font-size="13" text-anchor="end">Make a skill for English comments, then add GitHub MCP</text></g><g class="d"><circle cx="128" cy="292" r="12" fill="#6D28D9"/><text x="128" y="296" fill="#FFF" font-size="11" font-weight="700" text-anchor="middle">D</text><rect width="300" height="96" x="152" y="278" fill="#FFF" stroke="#DDD6FE" rx="10"/><rect width="40" height="20" x="166" y="290" fill="#EDE9FE" rx="6"/><text x="186" y="304" fill="#6D28D9" font-size="11" font-weight="700" text-anchor="middle">Skill</text><text x="216" y="305" fill="#111827" class="mono" font-size="13" font-weight="700">/en-comment</text><text x="166" y="334" fill="#6B7280" font-size="12">Always write code comments in English</text><rect width="74" height="24" x="366" y="340" fill="#6D28D9" rx="6"/><text x="403" y="356" fill="#FFF" font-size="12" text-anchor="middle">Add</text></g><g class="e"><rect width="300" height="96" x="464" y="278" fill="#FFF" stroke="#C7D2FE" rx="10"/><rect width="44" height="20" x="478" y="290" fill="#E0E7FF" rx="6"/><text x="500" y="304" fill="#4F46E5" font-size="11" font-weight="700" text-anchor="middle">MCP</text><text x="532" y="305" fill="#111827" class="mono" font-size="13" font-weight="700">github</text><text x="478" y="334" fill="#6B7280" font-size="12">Work with repos, issues and PRs directly</text><circle cx="483" cy="355" r="4" fill="#10B981"/><text x="494" y="359" fill="#059669" font-size="12">Connected · 26 tools</text></g></g><g class="sc s2"><text x="116" y="91" fill="#111827" font-size="14" font-weight="700">Personas · Each with its own strengths</text><g class="a"><rect width="230" height="112" x="116" y="120" fill="#FFF" stroke="#DDD6FE" rx="12"/><circle cx="146" cy="152" r="16" fill="#6D28D9"/><text x="146" y="157" fill="#FFF" font-size="13" font-weight="700" text-anchor="middle">D</text><text x="172" y="157" fill="#111827" font-size="14" font-weight="700">Deva</text><text x="132" y="192" fill="#374151" font-size="12">All-round work assistant</text><text x="132" y="212" fill="#6B7280" font-size="12">Code · Writing · Research · Shell</text><rect width="230" height="112" x="360" y="120" fill="#FFF" stroke="#FBCFE8" rx="12"/><circle cx="390" cy="152" r="16" fill="#DB2777"/><text x="390" y="157" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">X</text><text x="416" y="157" fill="#111827" font-size="14" font-weight="700">Xiaomajiang</text><text x="376" y="192" fill="#374151" font-size="12">Security research / Reversing</text><text x="376" y="212" fill="#6B7280" font-size="12">Hardcore techie vibe</text></g><g class="b"><rect width="294" height="34" x="606" y="248" fill="#6D28D9" rx="12"/><text x="886" y="270" fill="#FFF" font-size="13" text-anchor="end">Create a weekly-report persona, keep it formal</text></g><g class="c"><rect width="230" height="112" x="604" y="120" fill="#FFFBEB" stroke="#FCD34D" rx="12"/><circle cx="634" cy="152" r="16" fill="#D97706"/><text x="634" y="157" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">W</text><text x="660" y="157" fill="#111827" font-size="14" font-weight="700">Weekly Reporter</text><rect width="40" height="20" x="784" y="140" fill="#059669" rx="10"/><text x="804" y="154" fill="#FFF" font-size="11" text-anchor="middle">New</text><text x="620" y="192" fill="#374151" font-size="12">Formal tone · Well organized</text><text x="620" y="212" fill="#6B7280" font-size="12">Great at reports and summaries</text><circle cx="68" cy="188" r="15" fill="#D97706"/><text x="68" y="193" fill="#FFF" font-size="12" font-weight="700" text-anchor="middle">W</text></g><g class="d"><circle cx="128" cy="313" r="12" fill="#6D28D9"/><text x="128" y="317" fill="#FFF" font-size="11" font-weight="700" text-anchor="middle">D</text><rect width="300" height="34" x="152" y="298" fill="#F3F4F6" rx="12"/><text x="166" y="320" fill="#111827" font-size="13">Persona card ready. Confirm to start using it</text></g></g><g class="sc s3"><text x="116" y="91" fill="#111827" font-size="14" font-weight="700">Subagents · Auto-dispatch multiple agents in parallel</text><g class="a"><rect width="320" height="34" x="580" y="120" fill="#6D28D9" rx="12"/><text x="886" y="142" fill="#FFF" font-size="13" text-anchor="end">Map out the auth module and draft a refactor plan</text></g><g class="b"><circle cx="128" cy="183" r="12" fill="#6D28D9"/><text x="128" y="187" fill="#FFF" font-size="11" font-weight="700" text-anchor="middle">D</text><text x="152" y="188" fill="#111827" font-size="13">Splitting into 3 subtasks, dispatched to subagents in parallel:</text><rect width="240" height="92" x="152" y="202" fill="#FFF" stroke="#DDD6FE" rx="10"/><rect width="64" height="20" x="166" y="216" fill="#EDE9FE" rx="6"/><text x="198" y="230" fill="#6D28D9" font-size="11" font-weight="700" text-anchor="middle">Explore</text><text x="166" y="258" fill="#111827" font-size="13">Find auth-related files</text><rect width="164" height="6" x="166" y="272" fill="#E5E7EB" rx="3"/><rect width="164" height="6" x="166" y="272" fill="#7C3AED" class="f1" rx="3"/><text x="378" y="279" fill="#059669" class="k1" font-size="12" text-anchor="end">Done ✓</text><rect width="240" height="92" x="404" y="202" fill="#FFF" stroke="#DDD6FE" rx="10"/><rect width="64" height="20" x="418" y="216" fill="#EDE9FE" rx="6"/><text x="450" y="230" fill="#6D28D9" font-size="11" font-weight="700" text-anchor="middle">Explore</text><text x="418" y="258" fill="#111827" font-size="13">Locate token validation</text><rect width="164" height="6" x="418" y="272" fill="#E5E7EB" rx="3"/><rect width="164" height="6" x="418" y="272" fill="#7C3AED" class="f2" rx="3"/><text x="630" y="279" fill="#059669" class="k2" font-size="12" text-anchor="end">Done ✓</text><rect width="240" height="92" x="656" y="202" fill="#FFF" stroke="#DDD6FE" rx="10"/><rect width="44" height="20" x="670" y="216" fill="#E0E7FF" rx="6"/><text x="692" y="230" fill="#4F46E5" font-size="11" font-weight="700" text-anchor="middle">Plan</text><text x="670" y="258" fill="#111827" font-size="13">Research and draft the plan</text><rect width="164" height="6" x="670" y="272" fill="#E5E7EB" rx="3"/><rect width="164" height="6" x="670" y="272" fill="#4F46E5" class="f3" rx="3"/><text x="882" y="279" fill="#059669" class="k3" font-size="12" text-anchor="end">Done ✓</text></g><g class="e"><rect width="480" height="34" x="152" y="308" fill="#F3F4F6" rx="12"/><text x="166" y="330" fill="#111827" font-size="13">Summary: 5 auth entry points found, refactor plan ready for your approval</text></g></g><g class="sc s4"><text x="116" y="91" fill="#111827" font-size="14" font-weight="700"><tspan class="mono">/rewind</tspan> · Go back to before which turn?</text><g class="a"><rect width="440" height="150" x="116" y="118" fill="#FFF" stroke="#E5E7EB" rx="12"/></g><g class="b"><rect width="424" height="40" x="124" y="172" fill="#EDE9FE" stroke="#A78BFA" rx="8"/></g><g class="a"><text x="140" y="151" fill="#111827" font-size="13">Turn 3 · Refactor <tspan class="mono" font-size="12">login.ts</tspan></text><text x="536" y="151" fill="#6B7280" class="mono" font-size="12" text-anchor="end">+18 −42</text><text x="140" y="197" fill="#111827" font-size="13">Turn 2 · Add token refresh</text><text x="536" y="197" fill="#6B7280" class="mono" font-size="12" text-anchor="end">+36 −4</text><text x="140" y="243" fill="#111827" font-size="13">Turn 1 · Read the auth module</text><text x="536" y="243" fill="#6B7280" font-size="12" text-anchor="end">read-only</text></g><g class="c"><rect width="324" height="150" x="576" y="118" fill="#FFF" stroke="#E5E7EB" rx="12"/><text x="592" y="146" fill="#111827" font-size="13" font-weight="700">What to restore?</text><circle cx="598" cy="174" r="6" fill="none" stroke="#9CA3AF" stroke-width="1.5"/><text x="614" y="179" fill="#374151" font-size="13">Code only</text><circle cx="598" cy="204" r="6" fill="none" stroke="#9CA3AF" stroke-width="1.5"/><text x="614" y="209" fill="#374151" font-size="13">Conversation only</text><rect width="308" height="34" x="584" y="220" fill="#F5F3FF" rx="8"/><circle cx="598" cy="237" r="6" fill="none" stroke="#6D28D9" stroke-width="1.5"/><circle cx="598" cy="237" r="3" fill="#6D28D9"/><text x="614" y="242" fill="#6D28D9" font-size="13" font-weight="700">Both code and conversation</text></g><g class="d"><rect width="784" height="44" x="116" y="284" fill="#ECFDF5" stroke="#A7F3D0" rx="10"/><text x="136" y="311" fill="#047857" font-size="13">✓ Rewound to before turn 2. <tspan class="mono" font-size="12">login.ts</tspan> and 2 other files restored</text><text x="884" y="311" fill="#6D28D9" font-size="13" font-weight="700" text-anchor="end">Undo</text></g></g><g class="sc s5"><text x="116" y="91" fill="#111827" font-size="14" font-weight="700">Scheduled tasks · Set up in one sentence</text><g class="a"><rect width="381" height="34" x="519" y="120" fill="#6D28D9" rx="12"/><text x="886" y="142" fill="#FFF" font-size="13" text-anchor="end">Every day at 9am, turn yesterday&apos;s commits into a daily report</text></g><g class="b"><circle cx="128" cy="186" r="12" fill="#6D28D9"/><text x="128" y="190" fill="#FFF" font-size="11" font-weight="700" text-anchor="middle">D</text><rect width="360" height="128" x="152" y="172" fill="#FFF" stroke="#DDD6FE" rx="10"/><text x="168" y="198" fill="#111827" font-size="14" font-weight="700">New scheduled task</text><text x="168" y="224" fill="#9CA3AF" font-size="12">Name</text><text x="236" y="224" fill="#111827" font-size="13">Daily report</text><text x="168" y="248" fill="#9CA3AF" font-size="12">Schedule</text><text x="236" y="248" fill="#111827" font-size="13">Every day 09:00</text><text x="168" y="272" fill="#9CA3AF" font-size="12">Persona</text><text x="236" y="272" fill="#111827" font-size="13">Deva · current model</text><rect width="78" height="26" x="420" y="262" fill="#6D28D9" rx="6"/><text x="459" y="279" fill="#FFF" font-size="12" text-anchor="middle">Create</text></g><g class="c"><rect width="300" height="34" x="152" y="314" fill="#F3F4F6" rx="12"/><text x="166" y="336" fill="#111827" font-size="13">Created. Runs automatically at 9:00 tomorrow</text></g><g class="d"><rect width="308" height="76" x="588" y="186" fill="#FFF" stroke="#E5E7EB" filter="url(#pop)" rx="12"/><rect width="28" height="28" x="604" y="202" fill="#6D28D9" rx="7"/><text x="618" y="221" fill="#FFF" font-size="13" font-weight="700" text-anchor="middle">D</text><text x="644" y="214" fill="#111827" font-size="13" font-weight="700">Scheduled task completed</text><text x="884" y="214" fill="#9CA3AF" font-size="11" text-anchor="end">09:00</text><text x="644" y="238" fill="#6B7280" font-size="12">Daily report: 12 commits summarized</text></g></g><g class="sc s6"><text x="116" y="91" fill="#111827" font-size="14" font-weight="700">Mobile · Keep chatting from Telegram</text><rect width="172" height="280" x="716" y="110" fill="#111827" rx="22"/><rect width="156" height="264" x="724" y="118" fill="#F9FAFB" rx="16"/><text x="802" y="140" fill="#111827" font-size="12" font-weight="700" text-anchor="middle">Deva Bot</text><line x1="724" x2="880" y1="150" y2="150" stroke="#E5E7EB"/><g class="a"><rect width="128" height="28" x="742" y="162" fill="#2AABEE" rx="10"/><text x="860" y="181" fill="#FFF" font-size="12" text-anchor="end">Run the tests for me</text></g><g class="b"><rect width="144" height="34" x="546" y="120" fill="#6D28D9" rx="12"/><text x="676" y="142" fill="#FFF" font-size="13" text-anchor="end">Run the tests for me</text><rect width="84" height="18" x="452" y="128" fill="#DBEAFE" rx="9"/><text x="494" y="141" fill="#1D4ED8" font-size="11" text-anchor="middle">via Telegram</text></g><g class="c"><circle cx="128" cy="186" r="12" fill="#6D28D9"/><text x="128" y="190" fill="#FFF" font-size="11" font-weight="700" text-anchor="middle">D</text><rect width="360" height="58" x="152" y="172" fill="#111827" rx="8"/><text x="168" y="196" fill="#A7F3D0" class="mono" font-size="12">$ pnpm test</text><text x="168" y="217" fill="#9CA3AF" class="mono" font-size="12">✓ 42 passed (3.2s)</text></g><g class="d"><rect width="220" height="34" x="152" y="244" fill="#F3F4F6" rx="12"/><text x="166" y="266" fill="#111827" font-size="13">All tests passed 42/42 ✓</text><rect width="128" height="46" x="734" y="200" fill="#FFF" stroke="#E5E7EB" rx="10"/><text x="746" y="219" fill="#111827" font-size="12">All tests passed</text><text x="746" y="236" fill="#111827" font-size="12">42/42 ✓</text><text x="802" y="368" fill="#9CA3AF" font-size="10" text-anchor="middle">Synced with your desktop</text></g></g><g font-size="13" text-anchor="middle"><g fill="#FFF" fill-opacity=".14"><rect width="136" height="34" x="52" y="458" rx="17"/><rect width="136" height="34" x="196" y="458" rx="17"/><rect width="136" height="34" x="340" y="458" rx="17"/><rect width="136" height="34" x="484" y="458" rx="17"/><rect width="136" height="34" x="628" y="458" rx="17"/><rect width="136" height="34" x="772" y="458" rx="17"/></g><g fill="#FFF" fill-opacity=".8"><text x="120" y="480">All in Chat</text><text x="264" y="480">Personas</text><text x="408" y="480">Subagents</text><text x="552" y="480">Rewind</text><text x="696" y="480">Scheduled Tasks</text><text x="840" y="480">Mobile</text></g><g class="hl t1"><rect width="136" height="34" x="52" y="458" fill="#FFF" rx="17"/><text x="120" y="480" fill="#6D28D9" font-weight="700">All in Chat</text><rect width="96" height="2" x="72" y="486" fill="#C4B5FD" class="pg" rx="1"/></g><g class="hl t2"><rect width="136" height="34" x="196" y="458" fill="#FFF" rx="17"/><text x="264" y="480" fill="#6D28D9" font-weight="700">Personas</text><rect width="96" height="2" x="216" y="486" fill="#C4B5FD" class="pg" rx="1"/></g><g class="hl t3"><rect width="136" height="34" x="340" y="458" fill="#FFF" rx="17"/><text x="408" y="480" fill="#6D28D9" font-weight="700">Subagents</text><rect width="96" height="2" x="360" y="486" fill="#C4B5FD" class="pg" rx="1"/></g><g class="hl t4"><rect width="136" height="34" x="484" y="458" fill="#FFF" rx="17"/><text x="552" y="480" fill="#6D28D9" font-weight="700">Rewind</text><rect width="96" height="2" x="504" y="486" fill="#C4B5FD" class="pg" rx="1"/></g><g class="hl t5"><rect width="136" height="34" x="628" y="458" fill="#FFF" rx="17"/><text x="696" y="480" fill="#6D28D9" font-weight="700">Scheduled Tasks</text><rect width="96" height="2" x="648" y="486" fill="#C4B5FD" class="pg" rx="1"/></g><g class="hl t6"><rect width="136" height="34" x="772" y="458" fill="#FFF" rx="17"/><text x="840" y="480" fill="#6D28D9" font-weight="700">Mobile</text><rect width="96" height="2" x="792" y="486" fill="#C4B5FD" class="pg" rx="1"/></g></g><text x="480" y="522" fill="#FFF" fill-opacity=".7" font-size="12" text-anchor="middle">Deva · A chat-first desktop AI assistant · github.com/sqfcyily/deva</text></svg>